services:
  - type: web
    name: universal-ai-saas
    runtime: docker
    region: frankfurt          # closest to the UK; change if you prefer oregon/ohio/singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "false"
      # Render generates this for you; copy it from the dashboard to call the API.
      - key: PLATFORM_API_KEY
        generateValue: true
      # Database: SQLite by default (free, automatic, no signup). Its file lives on
      # ephemeral disk, so set the Turso pair below (free tier) to keep records
      # across redeploys. Set DATABASE_URL to a postgres:// URL instead if you prefer.
      - key: DB_PATH
        value: /app/outputs/library.db
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      # Add provider keys in the dashboard after the first deploy.
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: POLLINATIONS_API_KEY
        sync: false
